site_name: Open Agent World
site_description: Build your AI team on one canvas. Guides for users and plugin developers.
site_url: https://theafish.github.io/open-agent-world/
repo_url: https://github.com/theAfish/open-agent-world
repo_name: theAfish/open-agent-world
edit_uri: edit/dev/docs/
docs_dir: docs
site_dir: .tmp/docs-site
strict: true
theme:
  name: material
  custom_dir: scripts/docs_theme
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font: false
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
plugins:
  - search:
      lang: [en, zh]
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
hooks:
  - scripts/docs_hooks.py
extra_css:
  - stylesheets/extra.css
exclude_docs: |
  /internal/**
  /assets/demos/README.md
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
nav:
  - User guide:
      - README.md
      - README.zh-CN.md
      - user-guide/index.md
      - user-guide/index.zh-CN.md
      - install.md
      - install.zh-CN.md
